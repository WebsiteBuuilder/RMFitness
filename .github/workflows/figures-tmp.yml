name: Figure maps for new cards (temporary)
on:
  push:
    branches: [claude/project-thread-jo021m]
    paths: [scripts/fig-ids.txt]
permissions:
  contents: write
jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install onnxruntime numpy pillow opencv-python-headless scipy
      - run: curl -sSL -o depth.onnx https://github.com/fabio-sim/Depth-Anything-ONNX/releases/download/v2.0.0/depth_anything_v2_vits_dynamic.onnx
      - run: python3 scripts/build-figures.py depth.onnx --only $(cat scripts/fig-ids.txt) 2>&1 | tail -40
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards/fig && git commit -m "Figure maps for the new Speed Duel monsters" && git pull --rebase && git push
