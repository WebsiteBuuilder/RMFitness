name: Speed pool audit (temporary)
on:
  push:
    branches: [claude/project-thread-jo021m]
    paths: [scripts/audit_speed_pool.py, .github/workflows/audit-speed.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/audit_speed_pool.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit && git commit -m "Speed pool audit dump" && git push
